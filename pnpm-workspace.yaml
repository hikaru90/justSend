packages:
  - '.'

allowBuilds:
  # Native / bundler postinstalls we need
  better-sqlite3: true
  esbuild: true
  # Transitive from Pi SDK (@earendil-works/pi-ai) — Owlery uses OpenRouter, not Google
  '@google/genai': false
  protobufjs: false
  '@swc/core': true

patchedDependencies:
  '@usewaypoint/block-container@0.0.2': patches/@usewaypoint__block-container@0.0.2.patch
