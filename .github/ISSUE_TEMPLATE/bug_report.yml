name: Bug report
description: Report something that isn't working as expected
title: '[Bug]: '
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Owlery version / tag
      description: e.g. v0.1.0, main @ commit SHA, or Docker image tag
      placeholder: v0.1.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, Docker vs bare metal, OS, etc.
      placeholder: |
        Node 22.14.0, Docker Compose
        Ubuntu 24.04
    validations:
      required: true

  - type: input
    id: ses-region
    attributes:
      label: SES region
      description: AWS region configured for sending (if applicable)
      placeholder: eu-central-1

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include logs or screenshots if helpful)
    validations:
      required: true
