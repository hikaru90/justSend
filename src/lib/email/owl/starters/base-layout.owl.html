<!DOCTYPE html>

<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<style data-owl-base-css>
:root{color-scheme:light dark;}
html,body{margin:0!important;padding:0!important;width:100%!important;}
img{max-width:100%!important;height:auto!important;border:0;}
table{border-collapse:collapse;}
.owl-dark,.logo-dark{display:none!important;max-height:0!important;overflow:hidden!important;}
@media (prefers-color-scheme:dark){
.owl-light,.logo-light{display:none!important;max-height:0!important;overflow:hidden!important;}
.owl-dark,.logo-dark{display:block!important;max-height:none!important;overflow:visible!important;}
}
@media only screen and (max-width:620px){
.owl-stack{display:block!important;width:100%!important;max-width:100%!important;}
}
</style>
